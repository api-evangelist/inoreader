aid: inoreader
name: Inoreader
image: https://www.inoreader.com/images/landing/v4/og-images/og-image-default.png
description: Inoreader provides a powerful RSS feed reader and content aggregation platform that lets users subscribe to, organize, and share
  web content. It offers features such as automated tagging, rules for filtering, offline access, and collaborative sharing for teams. The service
  includes a developer API that enables programmatic access to feed data, article content, and user actions, supporting integration with third‑party
  applications and custom workflows.
